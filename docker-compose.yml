services:
  db:
    image: postgres:16
    container_name: nailbabe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nailbabe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nailbabe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
